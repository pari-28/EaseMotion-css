<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw Border Checkout Popover</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="checkout-card">

    <button class="checkout-btn">
        View Order Summary
    </button>

    <div class="popover" role="dialog" aria-label="Checkout Summary">

        <h3>Checkout Summary</h3>

        <ul>
            <li>Wireless Mouse <span>$29</span></li>
            <li>Keyboard <span>$45</span></li>
            <li>Delivery <span>Free</span></li>
        </ul>

        <strong>Total: $74</strong>

    </div>

</div>

</body>
</html>
